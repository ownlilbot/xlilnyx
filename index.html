<script>
const img = document.getElementById("mainImg");
img.onload = () => img.classList.add("loaded");

const music = document.getElementById("bgmusic");
const playBtn = document.getElementById("playBtn");
let isPlaying = false;

playBtn.addEventListener("click", () => {
  if (!isPlaying) {
    music.play();
    playBtn.textContent = "♪ MUSIC PLAYING";
    playBtn.style.opacity = "0.8";
    isPlaying = true;
  } else {
    music.pause();
    playBtn.textContent = "▶ PLAY MUSIC";
    playBtn.style.opacity = "1";
    isPlaying = false;
  }
});

// 🔹 Particle system — optimized (max 100 particles)
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener("resize",resize);resize();

class Particle {
  constructor(x,y,vx,vy,size,color,life){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.size=size;this.color=color;this.life=life;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.life--;this.size*=0.99;}
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=this.color;
    ctx.fill();
  }
}

function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(particles.length<100 && Math.random()<0.4){
    particles.push(new Particle(Math.random()*canvas.width,Math.random()*canvas.height,
      (Math.random()-0.5)*0.2,(Math.random()-0.5)*0.2,Math.random()*2+0.5,
      Math.random()<0.5?"#0ff":"#fff",150));
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.update();p.draw();
    if(p.life<=0)p.length<=0?particles.splice(i,1):particles.splice(i,1);
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ⚡ Lightning — optimized (lower frequency, thinner stroke)
const lightning = document.getElementById("lightning");
const lctx = lightning.getContext("2d");
function resizeLightning(){lightning.width=innerWidth;lightning.height=innerHeight;}
resizeLightning();window.addEventListener("resize",resizeLightning);

function drawLightning(){
  if(Math.random()<0.015){ // ⚡ lebih jarang
    const startX=Math.random()*lightning.width;
    const startY=0;
    const endY=lightning.height*(0.4+Math.random()*0.3);
    let x=startX,y=startY;
    lctx.strokeStyle="rgba(0,255,255,0.8)";
    lctx.lineWidth=1.5;
    lctx.shadowBlur=15;
    lctx.shadowColor="#0ff";
    lctx.beginPath();
    lctx.moveTo(x,y);
    while(y<endY){
      const xOffset=(Math.random()-0.5)*20;
      const yOffset=Math.random()*20;
      x+=xOffset;y+=yOffset;
      lctx.lineTo(x,y);
    }
    lctx.stroke();
    setTimeout(()=>lctx.clearRect(0,0,lightning.width,lightning.height),150);
  }
  requestAnimationFrame(drawLightning);
}
drawLightning();
</script>
